    <script>
      (function () {
        var RECOVERY_KEY = 'rg_dca_sw_recovery_ts';
        function clearCachesAndReload() {
          try {
            var last = Number(sessionStorage.getItem(RECOVERY_KEY) || 0);
            if (Date.now() - last < 15000) return;
            sessionStorage.setItem(RECOVERY_KEY, String(Date.now()));
          } catch (e) {}
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }
          Promise.all(tasks).finally(function () {
            window.location.reload();
          });
        }

        window.addEventListener('error', function (evt) {
          var target = evt && evt.target;
          if (!target) return;
          var tag = target.tagName;
          var url = (tag === 'SCRIPT' ? target.src : tag === 'LINK' ? target.href : '') || '';
          if (url.indexOf('/assets/') !== -1) {
            clearCachesAndReload();
          }
        }, true);

        window.addEventListener('vite:preloadError', function (evt) {
          if (evt && typeof evt.preventDefault === 'function') evt.preventDefault();
          clearCachesAndReload();
        });
      })();
    </script>

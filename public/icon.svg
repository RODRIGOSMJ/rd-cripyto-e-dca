<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0910" />
      <stop offset="48%" stop-color="#14080C" />
      <stop offset="100%" stop-color="#09070A" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF233C" />
      <stop offset="55%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#8F0D18" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#E11D2E" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E11D2E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#topGlow)" />

  <!-- Subtle outer ring -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#E11D2E" stroke-opacity="0.35" stroke-width="6" />

  <!-- SPFC Tricolor horizontal band across middle-top -->
  <rect x="64" y="106" width="384" height="16" rx="8" fill="#E11D2E" />
  <rect x="64" y="128" width="384" height="10" rx="5" fill="#FFFFFF" />
  <rect x="64" y="144" width="384" height="14" rx="7" fill="#111115" stroke="#334155" stroke-width="1.5" />

  <!-- Central RG Badge -->
  <rect x="108" y="182" width="296" height="176" rx="34" fill="url(#crimsonGrad)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" />
  <text
    x="256"
    y="302"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
    font-size="126"
    font-weight="800"
    letter-spacing="-4"
  >RG</text>

  <!-- DCA upward line + subtitle -->
  <path
    d="M120 416 L186 392 L240 406 L312 374 L388 386"
    fill="none"
    stroke="#10B981"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="388" cy="386" r="10" fill="#34D399" />
  <text
    x="256"
    y="456"
    text-anchor="middle"
    fill="#F8FAFC"
    fill-opacity="0.9"
    font-family="'JetBrains Mono', monospace"
    font-size="34"
    font-weight="700"
    letter-spacing="4"
  >CRYPTO DCA</text>
</svg>
